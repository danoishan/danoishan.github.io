name: Build Vercel preview manifest
on:
  push:
    branches: [portfolio-review-upgrades]

permissions:
  contents: write

jobs:
  build-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-review-upgrades
      - name: Build inline-file manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          include_ext = {'.html','.css','.js','.md','.xml','.txt','.svg'}
          files=[]
          for p in sorted(Path('.').rglob('*')):
              if not p.is_file():
                  continue
              rel=p.as_posix()
              if rel.startswith('.git/') or rel.startswith('.github/') or rel == 'vercel-files.json':
                  continue
              if p.suffix.lower() not in include_ext and rel != '.nojekyll':
                  continue
              text=p.read_text(encoding='utf-8')
              if p.suffix.lower()=='.html':
                  live='https://danoishan.github.io/Danoishan_Sinnathamby_Resume.pdf'
                  for old in [
                      'Danoishan_Sinnathamby_Resume_2026.pdf',
                      'Danoishan_Sinnathamby_Resume.pdf',
                      '../Danoishan_Sinnathamby_Resume_2026.pdf',
                      '../Danoishan_Sinnathamby_Resume.pdf'
                  ]:
                      text=text.replace(old,live)
              files.append({'file':rel,'data':text})
          Path('vercel-files.json').write_text(json.dumps(files,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(f'Bundled {len(files)} text files')
          PY
      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel-files.json
          git commit -m 'Build temporary Vercel preview manifest'
          git push

name: Count visible long dashes
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  count:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count visible em and en dashes
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'head','script','style'}:
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'head','script','style'} and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          total_em = total_en = 0
          rows = []
          for p in sorted(Path('.').rglob('*.html')):
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              parser = VisibleText()
              parser.feed(p.read_text(encoding='utf-8'))
              text = ''.join(parser.parts)
              em = text.count('—')
              en = text.count('–')
              if em or en:
                  rows.append((str(p), em, en))
                  total_em += em
                  total_en += en
          print(f'VISIBLE_EM_DASH_TOTAL={total_em}')
          print(f'VISIBLE_EN_DASH_TOTAL={total_en}')
          print('BY_PAGE')
          for path, em, en in rows:
              print(f'{path}\tem={em}\ten={en}')
          PY

name: Check Google verification file
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-live-file:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check live verification file
        run: |
          sleep 8
          expected='google-site-verification: googleac53f3714c9af452.html'
          actual="$(curl -fsSL https://danoishan.github.io/googleac53f3714c9af452.html)"
          echo "LIVE_RESPONSE=$actual"
          test "$actual" = "$expected"

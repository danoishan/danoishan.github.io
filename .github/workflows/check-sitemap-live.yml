name: Check live sitemap
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check sitemap and robots
        run: |
          set -e
          echo '=== NORMAL HEADERS ==='
          curl -sSIL https://danoishan.github.io/sitemap.xml
          echo '=== GOOGLEBOT HEADERS ==='
          curl -sSIL -A 'Googlebot' https://danoishan.github.io/sitemap.xml
          echo '=== SITEMAP BODY ==='
          curl -fsSL https://danoishan.github.io/sitemap.xml -o /tmp/sitemap.xml
          head -5 /tmp/sitemap.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          p='/tmp/sitemap.xml'
          root=ET.parse(p).getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=root.findall('s:url',ns)
          print('URL_COUNT=',len(urls))
          assert root.tag == '{http://www.sitemaps.org/schemas/sitemap/0.9}urlset'
          assert len(urls) > 0
          PY
          echo '=== ROBOTS ==='
          curl -fsSL https://danoishan.github.io/robots.txt

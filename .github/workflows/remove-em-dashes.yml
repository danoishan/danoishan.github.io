name: Remove em dashes thoughtfully
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite em dash usage
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'index.html': [
              ('Danoishan Sinnathamby — Technical Delivery', 'Danoishan Sinnathamby | Technical Delivery'),
              ('team leadership — including the decisions and handoffs', 'team leadership, including the decisions and handoffs'),
            ],
            'lab/waypoint.html': [
              ('source, latency, scale and ownership — not a feature preference', 'source, latency, scale and ownership, not a feature preference'),
              ('successful campaign send is a checkpoint — not proof that the customer outcome worked', 'successful campaign send is a checkpoint, not proof that the customer outcome worked'),
            ],
            'notes/index.html': [
              ('Thinking in Systems — Donella Meadows', 'Thinking in Systems by Donella Meadows'),
              ('The Goal — Eliyahu Goldratt', 'The Goal by Eliyahu Goldratt'),
              ('The Checklist Manifesto — Atul Gawande', 'The Checklist Manifesto by Atul Gawande'),
              ('High Output Management — Andrew Grove', 'High Output Management by Andrew Grove'),
            ],
            'resume.html': [
              ('Vigorate — Senior Account Manager', 'Vigorate | Senior Account Manager'),
              ('EnsembleIQ — Digital Operations Manager', 'EnsembleIQ | Digital Operations Manager'),
              ('101 Mobility — Customer Success Manager', '101 Mobility | Customer Success Manager'),
              ('Jobs Canada Fair — Project Team Lead, Marketing & Events', 'Jobs Canada Fair | Project Team Lead, Marketing & Events'),
              ('Sheridan College</strong> — Diploma, Marketing Management', 'Sheridan College</strong> | Diploma, Marketing Management'),
              ('BrainStation</strong> — Product Management Certificate', 'BrainStation</strong> | Product Management Certificate'),
              ('For the portfolio version of the work — including the decisions, trade-offs, handoffs, adoption and system thinking behind these bullets — open the case studies.', 'For the portfolio version of the work, including the decisions, trade-offs, handoffs, adoption and system thinking behind these bullets, open the case studies.'),
            ],
            'work/125-campaigns.html': [
              ('the next iteration — not just the task in front of me', 'the next iteration, not just the task in front of me'),
            ],
            'work/200m-messages.html': [
              ('fewer surprises near launch — with a cleaner handoff', 'fewer surprises near launch, with a cleaner handoff'),
            ],
            'work/80-percent-drop.html': [
              ('customer journeys become hard to debug — and hard to adopt — when the organization cannot see or own the handoffs', 'customer journeys become hard to debug and hard to adopt when the organization cannot see or own the handoffs'),
            ],
          }

          for path, reps in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          # Page titles and social metadata use the dash as a separator. A pipe is cleaner here.
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace(' — Danoishan Sinnathamby', ' | Danoishan Sinnathamby')
              p.write_text(text, encoding='utf-8')

          remaining = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              if '—' in text:
                  remaining.append(str(p))
          if remaining:
              raise SystemExit('Em dashes remain in: ' + ', '.join(remaining))
          print('ALL_HTML_EM_DASHES_REMOVED')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' lab/*.html notes/*.html work/*.html
          git commit -m "Replace em dashes with natural punctuation"
          git push origin HEAD:main

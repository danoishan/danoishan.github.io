name: Build approved resume PDF
on:
  push:
    branches: [portfolio-review-upgrades]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-review-upgrades
          fetch-depth: 1
      - name: Build and validate resume PDF
        run: |
          python -m pip install --quiet weasyprint==68.0 pypdf
          weasyprint .resume-build/resume-source.html .resume-build/approved-resume.pdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import hashlib
          p = Path('.resume-build/approved-resume.pdf')
          r = PdfReader(str(p))
          if len(r.pages) != 2:
              raise SystemExit(f'Expected 2 pages, got {len(r.pages)}')
          text = '\n'.join(page.extract_text() or '' for page in r.pages)
          expected = [
              'Senior Account Manager',
              'Improved budget-to-click efficiency by 5 to 8%',
              'Salesforce Certified Administrator (2025)',
              '200M+ annual SMS/MMS and email sends',
              '125+ targeted email campaigns',
          ]
          for item in expected:
              if item not in text:
                  raise SystemExit(f'Missing expected resume text: {item}')
          data = p.read_bytes()
          if not data.startswith(b'%PDF-'):
              raise SystemExit('Generated file is not a PDF')
          print('pages=2')
          print('bytes=', len(data))
          print('sha256=', hashlib.sha256(data).hexdigest())
          PY
          cp .resume-build/approved-resume.pdf Danoishan_Sinnathamby_Resume.pdf
          cp .resume-build/approved-resume.pdf Danoishan_Sinnathamby_Resume_2026.pdf
          rm -rf .resume-build
          rm -f .github/workflows/build-approved-resume.yml
      - name: Commit approved resume
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish approved resume and finalize V1.1'
          git push

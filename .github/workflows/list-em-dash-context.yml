name: List visible em dash context
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  list:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print visible em dash phrases
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag in {'head','script','style'}: self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'head','script','style'} and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)
          for p in sorted(Path('.').rglob('*.html')):
              if '.git' in p.parts or '.github' in p.parts: continue
              parser=VisibleText(); parser.feed(p.read_text(encoding='utf-8'))
              text=' '.join(''.join(parser.parts).split())
              if '—' not in text: continue
              print('\nPAGE', p)
              for i, m in enumerate(re.finditer('—', text), 1):
                  a=max(0,m.start()-90); b=min(len(text),m.end()+90)
                  snippet=text[a:b]
                  print(f'{i}. {snippet}')
          PY

name: One-time performance check
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  perf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raw network timing
        run: |
          for i in 1 2 3; do
            curl -L -o /dev/null -sS -w "CURL_RUN_$i dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}B\n" https://danoishan.github.io/
          done
      - name: Install Lighthouse
        run: npm install -g lighthouse@12.8.2
      - name: Lighthouse mobile
        run: |
          lighthouse https://danoishan.github.io/ --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=mobile.json
          node - <<'JS'
          const r=require('./mobile.json'); const a=r.audits; const c=r.categories;
          console.log('MOBILE performance='+(c.performance.score*100));
          for (const k of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive','server-response-time']) console.log('MOBILE '+k+'='+a[k].displayValue);
          console.log('MOBILE transfer='+a['total-byte-weight'].displayValue);
          JS
      - name: Lighthouse desktop
        run: |
          lighthouse https://danoishan.github.io/ --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=desktop.json
          node - <<'JS'
          const r=require('./desktop.json'); const a=r.audits; const c=r.categories;
          console.log('DESKTOP performance='+(c.performance.score*100));
          for (const k of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive','server-response-time']) console.log('DESKTOP '+k+'='+a[k].displayValue);
          console.log('DESKTOP transfer='+a['total-byte-weight'].displayValue);
          JS

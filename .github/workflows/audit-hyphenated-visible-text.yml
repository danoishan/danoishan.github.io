name: Audit hyphenated visible text
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory hyphenated visible terms
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter, defaultdict
          import re

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag in {'head','script','style'}: self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'head','script','style'} and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)

          counts=Counter(); pages=defaultdict(set); contexts=defaultdict(list)
          pat=re.compile(r"\b[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+\b")
          for p in sorted(Path('.').rglob('*.html')):
              if '.git' in p.parts or '.github' in p.parts: continue
              parser=VisibleText(); parser.feed(p.read_text(encoding='utf-8'))
              text=' '.join(''.join(parser.parts).split())
              for m in pat.finditer(text):
                  term=m.group(0)
                  counts[term]+=1; pages[term].add(str(p))
                  if len(contexts[term])<3:
                      a=max(0,m.start()-60); b=min(len(text),m.end()+60)
                      contexts[term].append(text[a:b])
          for term in sorted(counts, key=lambda x:(x.lower(),x)):
              print(f'\nTERM={term} COUNT={counts[term]} PAGES={",".join(sorted(pages[term]))}')
              for c in contexts[term]: print('  ', c)
          print(f'\nUNIQUE={len(counts)} TOTAL={sum(counts.values())}')
          PY

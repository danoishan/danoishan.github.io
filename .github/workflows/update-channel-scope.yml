name: Update lifecycle channel scope
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align site to updated resume channel scope
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'index.html': [
              ('annual SMS/MMS and email sends supported across lifecycle programs', 'annual sends supported across email, SMS/MMS and push'),
              ('"Consent Management"]', '"Consent Management","Push Notifications","In-App Messaging"]'),
            ],
            'brief.html': [
              ('annual SMS/MMS and email sends supported', 'annual sends across email, SMS/MMS and push'),
            ],
            'resume.html': [
              ('200M+ annual SMS/MMS + email sends', '200M+ annual email + SMS/MMS + push sends'),
              ('Lead lifecycle and customer-engagement programs supporting <strong>200M+ annual SMS/MMS and email sends</strong>, coordinating segmentation, targeting, journey logic, automation requirements, data validation, QA, reporting and performance optimization.', 'Lead lifecycle and customer-engagement programs across email, SMS/MMS, push and in-app messaging, including high-volume CRM programs supporting <strong>200M+ annual sends across email, SMS/MMS and push</strong>, coordinating segmentation, targeting, journey logic, consent and channel eligibility, data validation, QA review, deployment readiness, reporting and optimization.'),
              ('Salesforce Marketing Cloud · Marketing Cloud Next · Salesforce Data 360 · Braze · Journey Builder · Email Studio · Wrike', 'Salesforce Marketing Cloud · Marketing Cloud Next · Salesforce Data 360 · Braze · Journey Builder · email, SMS/MMS, push and in-app messaging · Email Studio · Wrike'),
            ],
            'work/200m-messages.html': [
              ('The 200M+ annual SMS/MMS and email scale and delivery outcomes come from my current work history.', 'The 200M+ annual email, SMS/MMS and push scale and delivery outcomes come from my current work history.'),
              ('Enterprise lifecycle programs contain dozens of moving parts', 'Enterprise lifecycle programs across email, SMS/MMS, push and in-app contain dozens of moving parts'),
            ],
          }

          for path, reps in replacements.items():
              p = Path(path)
              s = p.read_text()
              for old, new in reps:
                  if old not in s:
                      raise SystemExit(f'Missing expected text in {path}: {old}')
                  s = s.replace(old, new)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html brief.html resume.html work/200m-messages.html
          git commit -m "Expand lifecycle channel scope to push and in-app"
          git push origin HEAD:main

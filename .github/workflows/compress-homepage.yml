name: Finalize homepage compression
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize section numbering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          if text.count('<p class="label">07 / Career</p>') != 1:
              raise SystemExit('Expected one 07 / Career label')
          text=text.replace('<p class="label">07 / Career</p>', '<p class="label">06 / Career</p>', 1)
          required=['Find the proof you need.','From outcome to operation.','04 / Notes','05 / About','06 / Career']
          for item in required:
              if item not in text: raise SystemExit(f'Missing {item}')
          banned=['Capabilities, with receipts.','04 / Handoffs, adoption & scale','05 / Notes','07 / Career','—']
          for item in banned:
              if item in text: raise SystemExit(f'Unexpected {item}')
          p.write_text(text,encoding='utf-8')
          labels=re.findall(r'<p class="label">([^<]+)</p>',text)
          print('FINAL_HOMEPAGE_LABELS',labels)
          print('FINAL_BYTES',len(text.encode('utf-8')))
          PY
      - name: Commit numbering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize homepage section numbering"
          git push origin HEAD:main

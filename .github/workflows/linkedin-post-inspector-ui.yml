name: LinkedIn Post Inspector UI
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run Post Inspector
        run: |
          cat > inspect-linkedin.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1200}});
            page.on('console', m => console.log('BROWSER_CONSOLE', m.type(), m.text()));
            try {
              await page.goto('https://www.linkedin.com/post-inspector/inspect/', {waitUntil:'domcontentloaded', timeout:60000});
              await page.waitForTimeout(3000);
              console.log('TITLE', await page.title());
              console.log('URL', page.url());
              console.log('BODY_BEFORE', (await page.locator('body').innerText()).slice(0,7000));
              console.log('INPUTS', await page.locator('input').evaluateAll(els=>els.map(e=>({type:e.type,name:e.name,placeholder:e.placeholder,visible:!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length)}))));
              console.log('BUTTONS', await page.locator('button').allTextContents());
              await page.screenshot({path:'post-inspector-before.png', fullPage:true});

              const input = page.locator('input:not([type="hidden"])').filter({visible:true}).first();
              const visibleInputs = await page.locator('input:not([type="hidden"])').count();
              console.log('NON_HIDDEN_INPUT_COUNT', visibleInputs);
              if (visibleInputs > 0) {
                await input.fill('https://danoishan.github.io/');
                const inspectButton = page.getByRole('button', {name:/inspect/i}).first();
                const submitInput = page.locator('input[type="submit"]').first();
                if (await inspectButton.count()) {
                  console.log('SUBMIT_METHOD button');
                  await inspectButton.click({timeout:10000}).catch(e=>console.log('CLICK_ERROR',e.message));
                } else if (await submitInput.count()) {
                  console.log('SUBMIT_METHOD input-submit');
                  await submitInput.click({timeout:10000}).catch(e=>console.log('CLICK_ERROR',e.message));
                } else {
                  console.log('SUBMIT_METHOD none');
                  await input.press('Enter').catch(e=>console.log('ENTER_ERROR',e.message));
                }
                await page.waitForTimeout(8000);
              }

              console.log('URL_AFTER', page.url());
              console.log('TITLE_AFTER', await page.title());
              console.log('BODY_AFTER', (await page.locator('body').innerText()).slice(0,12000));
              console.log('IMAGES', (await page.locator('img').evaluateAll(els=>els.map(e=>({src:e.src,alt:e.alt,width:e.naturalWidth,height:e.naturalHeight})))) .slice(0,30));
              await page.screenshot({path:'post-inspector-after.png', fullPage:true});
            } catch (e) {
              console.log('INSPECTOR_TEST_ERROR', e.message);
              await page.screenshot({path:'post-inspector-error.png', fullPage:true}).catch(()=>{});
            } finally {
              await browser.close();
            }
          })();
          JS
          node inspect-linkedin.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-post-inspector
          path: post-inspector-*.png
          retention-days: 1

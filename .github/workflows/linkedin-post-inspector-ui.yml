name: LinkedIn Post Inspector UI
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run Post Inspector
        run: |
          cat > /tmp/inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1200}});
            page.on('console', m => console.log('BROWSER_CONSOLE', m.type(), m.text()));
            await page.goto('https://www.linkedin.com/post-inspector/inspect/', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(3000);
            console.log('TITLE', await page.title());
            console.log('URL', page.url());
            const inputs = await page.locator('input').count();
            console.log('INPUT_COUNT', inputs);
            console.log('BUTTONS', await page.locator('button').allTextContents());
            console.log('BODY_BEFORE', (await page.locator('body').innerText()).slice(0,5000));
            await page.screenshot({path:'/tmp/post-inspector-before.png', fullPage:true});
            let input = page.locator('input').filter({hasNot: page.locator('[type="hidden"]')}).first();
            if (inputs) {
              await input.fill('https://danoishan.github.io/');
              let inspectButton = page.getByRole('button', {name:/inspect/i}).first();
              if (await inspectButton.count()) {
                await inspectButton.click();
                await page.waitForTimeout(7000);
              } else {
                console.log('NO_INSPECT_BUTTON');
              }
            }
            console.log('URL_AFTER', page.url());
            console.log('BODY_AFTER', (await page.locator('body').innerText()).slice(0,10000));
            console.log('IMAGES', (await page.locator('img').evaluateAll(els=>els.map(e=>({src:e.src,alt:e.alt,width:e.naturalWidth,height:e.naturalHeight})))) .slice(0,20));
            await page.screenshot({path:'/tmp/post-inspector-after.png', fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e); process.exit(1)});
          JS
          node /tmp/inspect.js
      - uses: actions/upload-artifact@v4
        with:
          name: linkedin-post-inspector
          path: /tmp/post-inspector-*.png
          retention-days: 1

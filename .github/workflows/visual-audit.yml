name: Visual audit screenshots
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture production screenshots
        run: |
          cat > screenshot.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const shots=[
              ['home-desktop.png','https://danoishan.github.io/',{width:1440,height:1000}],
              ['home-mobile.png','https://danoishan.github.io/',{width:390,height:844}],
              ['brief-desktop.png','https://danoishan.github.io/brief.html',{width:1440,height:1000}],
              ['case-desktop.png','https://danoishan.github.io/work/80-percent-drop.html',{width:1440,height:1000}],
              ['resume-desktop.png','https://danoishan.github.io/resume.html',{width:1440,height:1000}],
            ];
            for(const [name,url,viewport] of shots){
              const ctx=await browser.newContext({viewport});
              const page=await ctx.newPage();
              await page.goto(url,{waitUntil:'networkidle',timeout:30000});
              await page.screenshot({path:`shots/${name}`,fullPage:true});
              await ctx.close();
            }
            await browser.close();
          })();
          JS
          mkdir -p shots
          sleep 8
          node screenshot.js
      - uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: shots/*.png
          retention-days: 1

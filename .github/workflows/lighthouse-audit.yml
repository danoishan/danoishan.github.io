name: One-time Lighthouse audit
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lighthouse:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Lighthouse
        run: npm install -g lighthouse
      - name: Audit production homepage and flagship case
        run: |
          sleep 8
          lighthouse https://danoishan.github.io/ --quiet --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/home.json
          lighthouse https://danoishan.github.io/work/80-percent-drop.html --quiet --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/case.json
          node - <<'JS'
          const fs=require('fs');
          for (const [name,path] of [['HOME','/tmp/home.json'],['CASE','/tmp/case.json']]) {
            const r=JSON.parse(fs.readFileSync(path));
            console.log(name);
            for(const k of ['performance','accessibility','best-practices','seo']) console.log(`${k.toUpperCase()}=${Math.round(r.categories[k].score*100)}`);
            console.log(`FCP=${r.audits['first-contentful-paint'].displayValue}`);
            console.log(`LCP=${r.audits['largest-contentful-paint'].displayValue}`);
            console.log(`CLS=${r.audits['cumulative-layout-shift'].displayValue}`);
          }
          JS

name: Final portfolio cleanup

on:
  push:
    branches: [portfolio-final-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-final-cleanup
          fetch-depth: 0
      - name: Report current resume PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          echo "PDF_SHA256=$(sha256sum Danoishan_Sinnathamby_Resume_2026.pdf | cut -d' ' -f1)"
          echo "--- PDF TEXT START ---"
          pdftotext -layout Danoishan_Sinnathamby_Resume_2026.pdf -
          echo "--- PDF TEXT END ---"
      - name: Delete obsolete branches
        run: |
          for b in portfolio-review-upgrades portfolio-v3 resume-fix-temp resume-fix-temp2 resume-fix-temp3 resume-fix-temp4 resume-publish resume-spacing-final resume-spacing-fix resume-spacing-fix2; do
            git push origin --delete "$b" || true
          done

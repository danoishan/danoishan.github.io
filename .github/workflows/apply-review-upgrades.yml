name: Apply portfolio review upgrades

on:
  push:
    branches:
      - portfolio-review-upgrades
    paths:
      - .review-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-review-upgrades
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --quiet pillow
      - name: Apply upgrades
        run: python scripts/apply_portfolio_review.py
      - name: Commit review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply portfolio review upgrades" || exit 0
          git push origin HEAD:portfolio-review-upgrades
